<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Screenshot Template</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #040813;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      position: relative;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient background gradient & glowing orbs */
    .bg-gradient {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      background: radial-gradient(circle at 50% 0%, #0c1a30 0%, #040813 60%, #020409 100%);
      z-index: 1;
    }

    .top-glow {
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 720px;
      height: 400px;
      background: radial-gradient(circle, rgba(0, 194, 255, 0.22) 0%, rgba(0, 102, 204, 0) 70%);
      filter: blur(60px);
      z-index: 2;
    }

    .bottom-glow {
      position: absolute;
      bottom: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 194, 255, 0.15) 0%, rgba(0, 50, 120, 0) 70%);
      filter: blur(80px);
      z-index: 2;
    }

    /* Header text container */
    .header-container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 72px 54px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 194, 255, 0.12);
      border: 1.5px solid rgba(0, 194, 255, 0.4);
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #00d2ff;
      box-shadow: 0 0 25px rgba(0, 194, 255, 0.25);
    }

    .main-title {
      font-size: 58px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
      max-width: 960px;
    }

    .main-title .highlight {
      color: #00c2ff;
      text-shadow: 0 0 35px rgba(0, 194, 255, 0.6);
    }

    .sub-title {
      font-size: 25px;
      font-weight: 600;
      color: #94a3b8;
      line-height: 1.35;
      max-width: 880px;
    }

    /* Phone Mockup Frame */
    .phone-container {
      position: absolute;
      top: 450px;
      left: 50%;
      transform: translateX(-50%);
      width: 780px;
      height: 1600px;
      z-index: 10;
      border-radius: 54px;
      background: #111827;
      padding: 14px;
      box-shadow:
        0 30px 100px rgba(0, 0, 0, 0.95),
        0 0 50px rgba(0, 194, 255, 0.18),
        inset 0 1px 2px rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.15);
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      border-radius: 42px;
      overflow: hidden;
      background: #000000;
      position: relative;
    }

    .phone-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="top-glow"></div>
  <div class="bottom-glow"></div>

  <div class="header-container">
    <div class="category-badge" id="badge-text">⚡ TIEMPO REAL • EN VIVO</div>
    <div class="main-title" id="title-text">Horarios y Arribos <span class="highlight">en Vivo</span></div>
    <div class="sub-title" id="sub-text">Próximos trenes, andenes y distancias a estaciones en minutos</div>
  </div>

  <div class="phone-container">
    <div class="phone-screen">
      <img id="screen-img" src="screenshots/raw/1-nearby.png" alt="App Screen" />
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('badge')) document.getElementById('badge-text').innerText = params.get('badge');
    if (params.get('title')) document.getElementById('title-text').innerHTML = params.get('title');
    if (params.get('sub')) document.getElementById('sub-text').innerText = params.get('sub');
    if (params.get('img')) document.getElementById('screen-img').src = params.get('img');
  </script>
</body>
</html>
