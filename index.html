    <!-- Bulletproof Storage Polyfill for Android WebViews & Restricted Storage -->
    <script>
      (function() {
        function createMemStorage() {
          var store = new Map();
          return {
            getItem: function(k) { return store.has(k) ? store.get(k) : null; },
            setItem: function(k, v) { store.set(k, String(v)); },
            removeItem: function(k) { store.delete(k); },
            clear: function() { store.clear(); },
            get length() { return store.size; },
            key: function(i) { return Array.from(store.keys())[i] || null; }
          };
        }
        try {
          var test = window.localStorage;
          test.getItem('__test__');
        } catch (e) {
          try {
            var mem = createMemStorage();
            Object.defineProperty(window, 'localStorage', {
              value: mem,
              configurable: true,
              enumerable: true,
              writable: true
            });
          } catch (err) {}
        }
        try {
          var testSession = window.sessionStorage;
          testSession.getItem('__test__');
        } catch (e) {
          try {
            var memS = createMemStorage();
            Object.defineProperty(window, 'sessionStorage', {
              value: memS,
              configurable: true,
              enumerable: true,
              writable: true
            });
          } catch (err) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if (window.isSecureContext && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            const notifyUpdate = () => {
              window.dispatchEvent(new CustomEvent('rielar:sw-update', { detail: { registration: reg } }));
            };

            const checkUpdate = (worker) => {
              if (worker && worker.state === 'installed' && navigator.serviceWorker.controller) {
                notifyUpdate();
              }
            };

            if (reg.waiting && navigator.serviceWorker.controller) {
              notifyUpdate();
            }

            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => checkUpdate(newWorker));
              }
            });

            // Immediately check server for new version on launch
            try { reg.update(); } catch(e) {}

            // Periodically check for updates every 10 minutes while app is in foreground
            setInterval(() => {
              try { reg.update(); } catch(e) {}
            }, 10 * 60 * 1000);

            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') {
                try { reg.update(); } catch(e) {}
              }
            });
          }).catch(err => {
            console.log('SW registration note:', err.message);
          });
        });
      }
    </script>
  </body>
