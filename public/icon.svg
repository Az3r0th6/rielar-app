<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="trainFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Train Graphic -->
  <g filter="url(#shadow)" transform="translate(106, 86)">
    <!-- Main Train Body -->
    <rect x="15" y="40" width="270" height="230" rx="48" fill="url(#trainFront)"/>
    
    <!-- Windshield -->
    <rect x="40" y="70" width="220" height="85" rx="20" fill="#1e293b"/>
    
    <!-- Center light -->
    <circle cx="150" cy="55" r="10" fill="#facc15"/>
    
    <!-- Dual Headlights -->
    <circle cx="65" cy="200" r="16" fill="#facc15"/>
    <circle cx="235" cy="200" r="16" fill="#facc15"/>
    
    <!-- Grille / Bumper -->
    <rect x="85" y="225" width="130" height="12" rx="6" fill="#64748b"/>
    <rect x="95" y="245" width="110" height="8" rx="4" fill="#64748b"/>
    
    <!-- Tracks -->
    <line x1="10" y1="285" x2="290" y2="285" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <line x1="30" y1="305" x2="270" y2="305" stroke="#ffffff" stroke-width="8" stroke-dasharray="24 16" stroke-linecap="round"/>
  </g>
</svg>
